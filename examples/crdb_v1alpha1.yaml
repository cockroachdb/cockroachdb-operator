apiVersion: crdb.cockroachlabs.com/v1alpha1
kind: CrdbCluster
metadata:
  name: cockroachdb
  annotations:
    "crdb.cockroachlabs.com/regionCode": "east1"
    "crdb.cockroachlabs.com/cloudProvider": "gcp"
spec:
  dataStore:
    pvc:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "1Gi"
        volumeMode: Filesystem
  resources:
    requests:
    # This is intentionally low to make it work on local k3d clusters.
  #      cpu: 300m
  #      memory: 300Mi
  #    limits:
  #      cpu: 300m
  #      memory: 300Mi
  tlsEnabled: true
  image:
    name: cockroachdb/cockroach:v25.4.0
  nodes: 3

name: Roachdev AI PR Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

concurrency:
  group: review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  ai-review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'opened' && !github.event.pull_request.draft) ||
      github.event.action == 'synchronize' ||
      github.event.action == 'ready_for_review'
    uses: cockroachlabs/roachdev/.github/workflows/ai-review.yml@main
    with:
      pr_number: ${{ fromJSON(github.event.inputs.pr_number || github.event.pull_request.number) }}
      instructions: |
        This is a Kubernetes operator for CockroachDB. Before reviewing, read
        these files for operator-specific conventions, review checks, and
        recurring pitfalls:

        - CLAUDE.md (project overview, recurring pitfalls, change-type checklist)
        - AGENTS.md (code entry points, testing modes, troubleshooting)
        - .claude/rules/go-conventions.md (import layering, reconciler return helpers, error handling)
        - .claude/rules/commenting-standards.md (comment tone and style)
        - .claude/rules/testing-patterns.md (playback, record, golden files, datadriven)
        - .claude/skills/review/SKILL.md (tiered review checklist with operator-specific patterns)
        - .claude/skills/codex-review/SKILL.md (concurrency, security, recovery, UpdateStatus ordering, cross-cycle status bleed)
    secrets: inherit

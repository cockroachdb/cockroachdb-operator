name: tests

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

jobs:
  unit-tests:
    runs-on: ubuntu-latest-x64-8-core
    # id-token: write is required for the setup-private-go-modules action below,
    # which authenticates to GCP via Workload Identity Federation. Composite
    # actions cannot request their own permissions, so the caller must grant it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Validate VERSION file
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: VERSION file must contain a valid semver (got: '$VERSION')"
            exit 1
          fi
      # `make generate` runs gazelle's update-repos, which shells out to
      # `go list`/git to resolve modules not served by the public proxy --
      # including the private github.com/cockroachlabs/version. This action
      # assumes the shared go-deps service account, mints an installation token
      # for the listed repos, and rewrites the git URL so gazelle can clone the
      # private repo. We leave GOPRIVATE to generate-bazel.sh, which already
      # covers both the operator module and version.
      - uses: cockroachdb/actions/setup-private-go-modules@v0
        with:
          repositories: cockroachlabs/version
          configure-goprivate: false
      - name: Generate check tests
        run: |
          make generate
          git update-index -q --refresh
          if git diff-index --quiet HEAD --; then
            echo "No diffs generated by `make generate`."
          else
            echo "`make generate` resulted in changes. Make sure to run `make generate` and check in your changes."
            git diff-index HEAD
            exit 1
          fi
      - name: Modernize
        run: |
          make modernize
          git update-index -q --refresh
          if git diff-index --quiet HEAD --; then
            echo "No diffs generated by `make modernize`."
          else
            echo "`make modernize` resulted in changes. Make sure to run `make modernize` and check in your changes."
            git diff-index HEAD
            exit 1
          fi
      - name: Run tests
        run: |
          echo '{"type": "authorized_user"}' > creds.json
          GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/creds.json make test
      - uses: ./.github/actions/trim-bazel-cache
        if: always()

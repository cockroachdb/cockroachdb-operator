# permissions for end users to view crdbtenants.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crdbtenant-viewer-role
rules:
- apiGroups:
  - crdb.cockroachlabs.com
  resources:
  - crdbtenants
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - crdb.cockroachlabs.com
  resources:
  - crdbtenants/status
  verbs:
  - get
